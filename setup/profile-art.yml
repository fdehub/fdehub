name: Update contribution artwork

on:
  schedule:
    # Daily at 04:23 in Asia/Shanghai.
    - cron: '23 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/profile-art.yml']

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile
        uses: actions/checkout@v7.0.1

      - name: Generate contribution snakes
        uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/generated/snake.svg
            assets/generated/snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate 3D contribution calendars
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Publish contribution artwork
        run: |
          mkdir -p assets/generated
          cp profile-3d-contrib/profile-green-animate.svg assets/generated/calendar.svg
          cp profile-3d-contrib/profile-night-green.svg assets/generated/calendar-dark.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/
          if git diff --cached --quiet; then
            echo "Contribution artwork is already up to date."
            exit 0
          fi
          git commit -m "chore: update contribution artwork"
          git pull --rebase origin main
          git push origin HEAD:main
